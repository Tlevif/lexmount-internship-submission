name: Verify minimal submission from another host
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify four-category packages and public data anonymously
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,zipfile,io
          checks=[]
          expected={'01_作品说明','02_开发流程','03_岗位数据','04_源代码'}
          for base in ['https://tlevif.github.io/lexmount-internship-submission/','https://lexmount-internship-evidence-20261027.tlevif.chatgpt.site/']:
            for name in ['', 'demo.js','assets/jobs.json','materials/REPORT.pdf','materials/DEVELOPMENT.md','materials/jobs.jsonl','materials/jobs.csv','materials/source.zip','submission.zip']:
              print('CHECKING '+base+name,flush=True)
              with urllib.request.urlopen(urllib.request.Request(base+name,headers={'User-Agent':'Mozilla/5.0'}),timeout=90) as response:
                data=response.read();assert response.status==200
                item={'url':base+name,'status':response.status,'bytes':len(data)}
              if name=='':
                text=data.decode();assert '四类材料，一份提交包' in text and 'materials/DEVELOPMENT.md' in text
                assert not any(x in text for x in ['AUDIT_REPORT','FORM_TEXT','MANIFEST','SUMMARY.json','test_results.txt','原始证据文件索引'])
              if name=='materials/DEVELOPMENT.md':
                text=data.decode();assert all(x in text for x in ['Cloud Browser','WebFetch','session create','dump-dom','04_源代码'])
              if name=='assets/jobs.json' or name.endswith('jobs.jsonl'):
                rows=json.loads(data) if name.endswith('.json') else [json.loads(line) for line in data.decode().split('\n') if line]
                assert len(rows)==3095 and all(r['responsibilities'] and r['requirements'] for r in rows)
                assert sum(r['category_group']=='大模型' for r in rows)==1499
                item['jobs']=len(rows)
              if name.endswith('.zip'):
                z=zipfile.ZipFile(io.BytesIO(data));assert z.testzip() is None
                assert not any('__pycache__' in n or n.endswith(('.pyc','.log','.sqlite3','.png')) for n in z.namelist())
                if name=='submission.zip':
                  assert {n.split('/')[0] for n in z.namelist()}==expected
                  assert '01_作品说明/作品说明.pdf' in z.namelist()
                  assert '02_开发流程/开发流程与工具使用说明.md' in z.namelist()
                  assert len([json.loads(x) for x in z.read('03_岗位数据/jobs.jsonl').decode().split('\n') if x])==3095
                  assert not any('/evidence/' in n or n.endswith(('MANIFEST.json','SUMMARY.json','AUDIT_REPORT.md','FORM_TEXT.md')) for n in z.namelist())
                  item.update(files=len(z.namelist()),categories=sorted(expected),sha256=hashlib.sha256(data).hexdigest())
                else:assert 'app/main.py' in z.namelist() and 'data/jobs.jsonl' in z.namelist()
              checks.append(item)
          print('CROSS_HOST_VERIFICATION='+json.dumps({'host':'GitHub-hosted Ubuntu runner','authentication':'none','checks':checks},ensure_ascii=False))
          PY
