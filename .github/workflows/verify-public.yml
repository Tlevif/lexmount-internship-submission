name: Verify public submission from another host
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both public demos and complete technical results anonymously
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,zipfile,io
          checks=[]
          for base in ['https://tlevif.github.io/lexmount-internship-submission/','https://lexmount-internship-evidence-20261027.cherrydune65.chatgpt.site/']:
            for name in ['', 'demo.js','materials/REPORT.pdf','materials/results/jobs.json','submission.zip']:
              print('CHECKING '+base+name,flush=True)
              with urllib.request.urlopen(urllib.request.Request(base+name,headers={'User-Agent':'Mozilla/5.0'}),timeout=90) as r:
                data=r.read();assert r.status==200
                item={'url':base+name,'status':r.status,'bytes':len(data)}
              if name.endswith('jobs.json'):
                rows=json.loads(data);assert len(rows)==3095
                assert len({r['company_name'] for r in rows})==32
                assert len({r['category'] for r in rows})==33
                assert len({r['category'] for r in rows if r['category'].startswith('大模型')})==12
                assert all(r['responsibilities'] and r['requirements'] and r['classification']['keep'] for r in rows)
                assert not any(r['category'] in ['待审核','待核验','非计算机岗位','营销','业务分析','设计','客户服务'] for r in rows)
                assert not any(r['category']=='人工智能与算法' for r in rows)
                assert len({r['category_group'] for r in rows})==9
                assert sum(r['category_group']=='大模型' for r in rows)==1499
                assert all('与' not in r['category_label'] for r in rows)
                assert any('AI Infra' in r['title'] and r['category_group']=='大模型' for r in rows)
                item.update(jobs=len(rows),missing_responsibilities=0,missing_requirements=0,categories=33,large_model_categories=12)
              if name=='':
                text=data.decode();assert 'aria-label="大方向"' in text and 'aria-label="子方向"' in text
                assert 'id="page-jump"' in text and '跳转页码' in text
              if name=='demo.js':
                text=data.decode();assert "Number.isInteger(n)" in text
                assert not any(x in text for x in ['原站发布日期','稳定岗位ID','采集方式：','数据期：','相互印证','详情核验：','补采依据：'])
              if name=='submission.zip':
                item['sha256']=hashlib.sha256(data).hexdigest();z=zipfile.ZipFile(io.BytesIO(data));m=json.loads(z.read('MANIFEST.json'))
                for path,digest in m['files'].items():assert hashlib.sha256(z.read(path)).hexdigest()==digest,path
                item['verified_files']=len(m['files']);s=json.loads(z.read('SUMMARY.json'));assert s['jobs']==3095 and s['category_tree']['groups']==9 and s['category_tree']['large_model_jobs']==1499
                assert s['full_rebuild']['retained_missing']=={'responsibilities':0,'requirements':0}
                assert s['full_rebuild']['removed_non_cs_or_umbrella']==2295
                assert s['full_rebuild']['unverified_detail_jobs']==13
                assert s['removal_review']['restored_jobs']==190
                assert s['removal_review']['remain_removed_jobs']==2105
                assert s['removal_review']['deleted_incomplete_jobs']==13
                assert s['removal_review']['pending_incomplete_jobs']==0
                audit=json.loads(z.read('evidence/removal_review20261028/classification_audit.json'))
                assert len(audit)==2295 and sum(a['status']=='restored' for a in audit)==190
              checks.append(item)
          print('CROSS_HOST_VERIFICATION='+json.dumps({'host':'GitHub-hosted Ubuntu runner','authentication':'none','checks':checks},ensure_ascii=False))
          PY
